format:
  html:
    css: custom.css
    theme: flatly
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    toc-location: right
    grid:
          sidebar-width: 250px
          body-width: 800px
          margin-width: 250px   # Reserves distinct space for your TOC
